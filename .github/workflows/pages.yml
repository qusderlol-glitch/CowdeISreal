# Сборка и публикация на GitHub Pages: https://<user>.github.io/CowdeISreal/
# Чтобы приложение подключилось к бэкенду, добавьте в Settings → Secrets and variables → Actions → Variables:
#   VITE_SUPABASE_URL и VITE_SUPABASE_ANON_KEY (публичные значения; service_role сюда НЕ кладите).
# Без них сайт честно показывает экран настройки.
name: Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_TURN_ENABLED: ${{ vars.VITE_TURN_ENABLED || 'false' }}
      - run: cp dist/index.html dist/404.html  # SPA: любой путь отдаёт приложение
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
